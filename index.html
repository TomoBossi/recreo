<!-- The theme is set before anything paints, so a dark page never flashes light. -->
<script>
  try {
    const t = JSON.parse(localStorage.getItem('recreo:theme') ?? '"auto"')
    const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#16161a')
  } catch {}
  // A link to a room, for someone who has been here before (a saved name):
  // straight in, without the welcome screen showing first. app/main.js joins.
  try {
    const room = new URLSearchParams(location.hash.slice(1)).get('room') || new URLSearchParams(location.search).get('room')
    const nick = JSON.parse(localStorage.getItem('recreo:nick') ?? '""')
    if (room && typeof nick === 'string' && nick.trim()) document.documentElement.dataset.straightIn = '1'
  } catch {}
</script>

<body>

<main id="landing">
  <span id="landing-settings" class="anchor">
    <button class="btn icon settings-button" aria-label="settings" aria-expanded="false"></button>
    <div class="popover settings-pop" hidden></div>
  </span>

  <div class="card landing-card">
    <h1 class="brand big"><span class="bell-slot"></span><span class="wordmark big">recreo</span></h1>

    <div class="preview self-colour">
      <video id="preview" autoplay muted playsinline disablepictureinpicture></video>
      <div id="preview-placeholder" class="avatar"></div>
      <div class="preview-controls">
        <button id="preview-mic" type="button" class="wbtn media" aria-pressed="true" title="microphone" aria-label="microphone"></button>
        <button id="preview-cam" type="button" class="wbtn media" aria-pressed="true" title="camera" aria-label="camera"></button>
      </div>
      <div class="preview-controls end">
        <span id="preview-character" class="preview-character" hidden></span>
        <button id="preview-reroll" type="button" class="wbtn media" title="another character" aria-label="another character"></button>
      </div>
    </div>
    <div id="preview-devices"></div>

    <form id="join-form">
      <div class="field">
        <label for="nick-input">your name</label>
        <span class="row" id="name-row">
          <input id="nick-input" class="input" maxlength="15" autocomplete="nickname" required placeholder="name">
        </span>
      </div>
      <div class="field">
        <label for="room-input">room</label>
        <span class="row">
          <span class="combo">
            <input id="room-input" class="input" autocomplete="off" spellcheck="false" required placeholder="any name works"
              role="combobox" aria-expanded="false" aria-controls="room-list" aria-autocomplete="list">
            <ul id="room-list" class="combo-list" role="listbox" hidden></ul>
          </span>
          <button id="regenerate" type="button" class="btn small" title="a new room">new</button>
        </span>
      </div>
      <button id="join-button" type="submit" class="btn sun big">join room</button>
      <p id="landing-error" class="error" role="alert"></p>
    </form>
  </div>
</main>

<div id="app" hidden>
  <header id="topbar">
    <span class="brand"><span class="bell-slot"></span><span class="wordmark">recreo</span></span>
    <span id="room-chip" class="chip"><span class="label">room </span><b id="room-name"></b></span>
    <button id="invite" class="btn small sun" aria-label="invite" title="invite: share or copy the link"><svg class="link" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.6 9.4 9.4 6.6"/><path d="M8.6 4.4 9.9 3.1a2.6 2.6 0 0 1 3.7 3.7L12.3 8.1"/><path d="M7.4 11.6 6.1 12.9a2.6 2.6 0 0 1-3.7-3.7L3.7 7.9"/></g></svg><span class="label">invite</span></button>
    <span class="spacer"></span>
    <span class="anchor">
      <button id="new-table" class="btn small leaf" aria-expanded="false" aria-label="new game"><span class="plus">+</span><span class="label"> new game</span></button>
      <div id="shelf-pop" class="popover" hidden></div>
    </span>
    <span class="anchor">
      <button id="settings" class="btn small icon settings-button" aria-label="settings" aria-expanded="false"></button>
      <div class="popover settings-pop" hidden></div>
    </span>
    <button id="leave" class="btn small berry">leave</button>
  </header>
  <main id="desk"></main>
</div>
<!-- Outside the room, so the welcome screen's notices show too. -->
